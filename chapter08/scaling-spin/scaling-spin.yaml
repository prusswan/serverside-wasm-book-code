apiVersion: core.spinkube.dev/v1alpha1
kind: SpinApp
metadata:
  name: scaling-spin
spec:
  image: "ghcr.io/prusswan/serverside-wasm-book-code/scaling-spin:latest"
  executor: containerd-shim-spin
  enableAutoscaling: true
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # setup Docker registry secret wtih `kubectl create secret docker-registry ghcr-registry-secret --docker-username=username --docker-password=password --docker-server=ghcr.io`
  # https://learn.microsoft.com/en-us/azure/aks/deploy-spinkube
  imagePullSecrets:
    - name: ghcr-registry-secret
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaling-spin-autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaling-spin
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60
